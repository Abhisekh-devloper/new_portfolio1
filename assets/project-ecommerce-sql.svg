<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06081c"/>
      <stop offset="50%" stop-color="#091830"/>
      <stop offset="100%" stop-color="#120c29"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg)"/>

  <!-- Header Badge -->
  <rect x="40" y="30" width="220" height="28" rx="14" fill="rgba(0,242,254,0.1)" stroke="#00f2fe" stroke-opacity="0.35"/>
  <circle cx="56" cy="44" r="5" fill="#00f2fe"/>
  <text x="70" y="49" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="1">SQL DATA ANALYTICS</text>

  <!-- Left: SQL Code Terminal Mockup -->
  <g transform="translate(40, 75)">
    <rect width="280" height="240" rx="12" fill="#030412" stroke="rgba(0,242,254,0.2)"/>
    
    <!-- Window buttons -->
    <circle cx="20" cy="18" r="4.5" fill="#ff5f56"/>
    <circle cx="34" cy="18" r="4.5" fill="#ffbd2e"/>
    <circle cx="48" cy="18" r="4.5" fill="#27c93f"/>
    <text x="70" y="22" fill="#575a7c" font-family="'JetBrains Mono', monospace" font-size="10">ecommerce_analytics.sql</text>
    <line x1="0" y1="34" x2="280" y2="34" stroke="rgba(255,255,255,0.06)"/>

    <!-- SQL Syntax Highlighted Lines -->
    <text x="16" y="58" font-family="'JetBrains Mono', monospace" font-size="11">
      <tspan fill="#9b51e0">WITH</tspan> <tspan fill="#f5f6fa">Customer_RFM</tspan> <tspan fill="#9b51e0">AS</tspan> <tspan fill="#8c90b5">(</tspan>
    </text>
    <text x="24" y="80" font-family="'JetBrains Mono', monospace" font-size="11">
      <tspan fill="#00f2fe">SELECT</tspan> <tspan fill="#f5f6fa">customer_id,</tspan>
    </text>
    <text x="24" y="102" font-family="'JetBrains Mono', monospace" font-size="11">
      <tspan fill="#4facfe">NTILE</tspan><tspan fill="#8c90b5">(5)</tspan> <tspan fill="#9b51e0">OVER</tspan> <tspan fill="#8c90b5">(ORDER BY</tspan>
    </text>
    <text x="34" y="124" font-family="'JetBrains Mono', monospace" font-size="11">
      <tspan fill="#4facfe">SUM</tspan><tspan fill="#8c90b5">(order_value)</tspan> <tspan fill="#9b51e0">DESC</tspan><tspan fill="#8c90b5">)</tspan> <tspan fill="#9b51e0">AS</tspan> <tspan fill="#00f2fe">m_score,</tspan>
    </text>
    <text x="24" y="146" font-family="'JetBrains Mono', monospace" font-size="11">
      <tspan fill="#4facfe">COUNT</tspan><tspan fill="#8c90b5">(order_id)</tspan> <tspan fill="#9b51e0">AS</tspan> <tspan fill="#f5f6fa">frequency</tspan>
    </text>
    <text x="16" y="168" font-family="'JetBrains Mono', monospace" font-size="11">
      <tspan fill="#00f2fe">FROM</tspan> <tspan fill="#f5f6fa">orders</tspan> <tspan fill="#00f2fe">GROUP BY</tspan> <tspan fill="#8c90b5">1</tspan>
    </text>
    <text x="16" y="190" font-family="'JetBrains Mono', monospace" font-size="11">
      <tspan fill="#8c90b5">)</tspan>
    </text>
    <text x="16" y="212" font-family="'JetBrains Mono', monospace" font-size="11">
      <tspan fill="#00f2fe">SELECT</tspan> <tspan fill="#f5f6fa">segment,</tspan> <tspan fill="#4facfe">COUNT</tspan><tspan fill="#8c90b5">(*)</tspan> <tspan fill="#00f2fe">FROM</tspan> <tspan fill="#f5f6fa">rfm;</tspan>
    </text>
  </g>

  <!-- Right: Relational Schema & Metrics -->
  <g transform="translate(340, 75)">
    <!-- RFM Segments Widget -->
    <rect width="220" height="110" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)"/>
    <text x="16" y="26" fill="#8c90b5" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">RFM CUSTOMER TIERS</text>
    
    <text x="16" y="52" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="11">Champions (Top 20%)</text>
    <rect x="16" y="60" width="188" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="16" y="60" width="150" height="6" rx="3" fill="#00f2fe"/>

    <text x="16" y="84" fill="#9b51e0" font-family="'Outfit', sans-serif" font-size="11">Loyal Customers (35%)</text>
    <rect x="16" y="92" width="188" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="16" y="92" width="110" height="6" rx="3" fill="#9b51e0"/>

    <!-- Bottom Stat: Total Analyzed Orders -->
    <g transform="translate(0, 125)">
      <rect width="220" height="115" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="28" fill="#8c90b5" font-family="'Outfit', sans-serif" font-size="11">TRANSACTION DATASET</text>
      <text x="16" y="60" fill="#f5f6fa" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">100K+ <tspan fill="#00f2fe" font-size="13">Rows</tspan></text>
      <text x="16" y="85" fill="#8c90b5" font-family="'Outfit', sans-serif" font-size="11">Multi-Table Relational Schema</text>
      <text x="16" y="100" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="10">● Window Functions • CTEs</text>
    </g>
  </g>
</svg>