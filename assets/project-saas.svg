<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07071e"/>
      <stop offset="50%" stop-color="#0c0e2a"/>
      <stop offset="100%" stop-color="#140a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9b51e0"/>
      <stop offset="100%" stop-color="#e040fb"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="40" y1="60" x2="560" y2="60"/>
    <line x1="40" y1="120" x2="560" y2="120"/>
    <line x1="40" y1="180" x2="560" y2="180"/>
    <line x1="40" y1="240" x2="560" y2="240"/>
    <line x1="40" y1="300" x2="560" y2="300"/>
    <line x1="120" y1="40" x2="120" y2="320"/>
    <line x1="200" y1="40" x2="200" y2="320"/>
    <line x1="280" y1="40" x2="280" y2="320"/>
    <line x1="360" y1="40" x2="360" y2="320"/>
    <line x1="440" y1="40" x2="440" y2="320"/>
    <line x1="520" y1="40" x2="520" y2="320"/>
  </g>

  <!-- Header Badge -->
  <rect x="40" y="30" width="170" height="28" rx="14" fill="rgba(0,242,254,0.08)" stroke="#00f2fe" stroke-opacity="0.3"/>
  <circle cx="56" cy="44" r="5" fill="#00f2fe"/>
  <text x="70" y="49" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="1">SaaS ANALYTICS</text>

  <!-- KPI Cards -->
  <g transform="translate(40, 75)">
    <rect width="155" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)"/>
    <text x="16" y="24" fill="#8c90b5" font-family="'Outfit', sans-serif" font-size="11">MRR Growth</text>
    <text x="16" y="47" fill="#f5f6fa" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">+28.4%</text>
    <text x="100" y="47" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11">▲ MoM</text>
  </g>

  <g transform="translate(210, 75)">
    <rect width="155" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)"/>
    <text x="16" y="24" fill="#8c90b5" font-family="'Outfit', sans-serif" font-size="11">Customer LTV</text>
    <text x="16" y="47" fill="#f5f6fa" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">$4,850</text>
    <text x="105" y="47" fill="#9b51e0" font-family="'JetBrains Mono', monospace" font-size="11">● 4.2x</text>
  </g>

  <g transform="translate(380, 75)">
    <rect width="180" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)"/>
    <text x="16" y="24" fill="#8c90b5" font-family="'Outfit', sans-serif" font-size="11">Churn Rate</text>
    <text x="16" y="47" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">1.82%</text>
    <text x="110" y="47" fill="#8c90b5" font-family="'JetBrains Mono', monospace" font-size="11">Low Risk</text>
  </g>

  <!-- Area Chart -->
  <path d="M 50 280 L 110 250 L 180 260 L 250 210 L 320 220 L 390 170 L 460 185 L 550 145 L 550 290 L 50 290 Z" fill="url(#areaGrad)"/>
  <path d="M 50 280 L 110 250 L 180 260 L 250 210 L 320 220 L 390 170 L 460 185 L 550 145" fill="none" stroke="url(#accent)" stroke-width="3" filter="url(#glow)"/>

  <!-- Data Points -->
  <circle cx="110" cy="250" r="4" fill="#00f2fe" stroke="#050515" stroke-width="2"/>
  <circle cx="250" cy="210" r="4" fill="#00f2fe" stroke="#050515" stroke-width="2"/>
  <circle cx="390" cy="170" r="4" fill="#00f2fe" stroke="#050515" stroke-width="2"/>
  <circle cx="550" cy="145" r="5" fill="#4facfe" stroke="#fff" stroke-width="2"/>

  <!-- Secondary Trendline (Purple) -->
  <path d="M 50 260 L 130 240 L 220 250 L 310 200 L 410 210 L 550 175" fill="none" stroke="url(#purple)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Labels -->
  <text x="50" y="315" fill="#575a7c" font-family="'JetBrains Mono', monospace" font-size="11">Jan</text>
  <text x="150" y="315" fill="#575a7c" font-family="'JetBrains Mono', monospace" font-size="11">Apr</text>
  <text x="250" y="315" fill="#575a7c" font-family="'JetBrains Mono', monospace" font-size="11">Jul</text>
  <text x="350" y="315" fill="#575a7c" font-family="'JetBrains Mono', monospace" font-size="11">Oct</text>
  <text x="450" y="315" fill="#575a7c" font-family="'JetBrains Mono', monospace" font-size="11">Dec</text>
  <text x="530" y="315" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11">Forecast</text>
</svg>