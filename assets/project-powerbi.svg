<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a1a"/>
      <stop offset="50%" stop-color="#12132e"/>
      <stop offset="100%" stop-color="#0b1e28"/>
    </linearGradient>
    <linearGradient id="powerbiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2c94c"/>
      <stop offset="100%" stop-color="#f2994a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bg)"/>

  <!-- Header Badge -->
  <rect x="40" y="30" width="220" height="28" rx="14" fill="rgba(242,201,76,0.12)" stroke="#f2c94c" stroke-opacity="0.35"/>
  <circle cx="56" cy="44" r="5" fill="#f2c94c"/>
  <text x="70" y="49" fill="#f2c94c" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" letter-spacing="1">POWER BI DASHBOARD</text>

  <!-- 3 Top KPI Cards -->
  <g transform="translate(40, 75)">
    <rect width="160" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)"/>
    <text x="14" y="24" fill="#8c90b5" font-family="'Outfit', sans-serif" font-size="11">Total Revenue</text>
    <text x="14" y="48" fill="#f5f6fa" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">$1.42M</text>
    <text x="110" y="48" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11">+18%</text>
  </g>

  <g transform="translate(220, 75)">
    <rect width="160" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)"/>
    <text x="14" y="24" fill="#8c90b5" font-family="'Outfit', sans-serif" font-size="11">Net Profit Margin</text>
    <text x="14" y="48" fill="#f5f6fa" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">26.8%</text>
    <text x="110" y="48" fill="#f2c94c" font-family="'JetBrains Mono', monospace" font-size="11">● DAX</text>
  </g>

  <g transform="translate(400, 75)">
    <rect width="160" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)"/>
    <text x="14" y="24" fill="#8c90b5" font-family="'Outfit', sans-serif" font-size="11">Customer Count</text>
    <text x="14" y="48" fill="#f5f6fa" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">48,210</text>
    <text x="115" y="48" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11">Active</text>
  </g>

  <!-- Bottom Left: Bar Chart / Performance Visualizer -->
  <g transform="translate(40, 150)">
    <rect width="320" height="165" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)"/>
    <text x="16" y="24" fill="#8c90b5" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">SALES BY REGION & QUARTER</text>

    <!-- Bars -->
    <rect x="25" y="70" width="28" height="65" rx="4" fill="url(#barGrad)"/>
    <rect x="65" y="50" width="28" height="85" rx="4" fill="url(#barGrad)"/>
    <rect x="105" y="85" width="28" height="50" rx="4" fill="url(#barGrad)"/>
    <rect x="145" y="40" width="28" height="95" rx="4" fill="url(#barGrad)"/>
    <rect x="185" y="60" width="28" height="75" rx="4" fill="url(#barGrad)"/>
    <rect x="225" y="30" width="28" height="105" rx="4" fill="url(#powerbiGrad)"/>
    <rect x="265" y="45" width="28" height="90" rx="4" fill="url(#barGrad)"/>

    <!-- Baseline -->
    <line x1="20" y1="135" x2="300" y2="135" stroke="rgba(255,255,255,0.1)"/>
    <text x="30" y="150" fill="#575a7c" font-family="'JetBrains Mono', monospace" font-size="9">Q1</text>
    <text x="70" y="150" fill="#575a7c" font-family="'JetBrains Mono', monospace" font-size="9">Q2</text>
    <text x="110" y="150" fill="#575a7c" font-family="'JetBrains Mono', monospace" font-size="9">Q3</text>
    <text x="150" y="150" fill="#575a7c" font-family="'JetBrains Mono', monospace" font-size="9">Q4</text>
    <text x="190" y="150" fill="#575a7c" font-family="'JetBrains Mono', monospace" font-size="9">APAC</text>
    <text x="225" y="150" fill="#f2c94c" font-family="'JetBrains Mono', monospace" font-size="9">EMEA</text>
    <text x="265" y="150" fill="#575a7c" font-family="'JetBrains Mono', monospace" font-size="9">US</text>
  </g>

  <!-- Bottom Right: Donut Chart / Category Breakdown -->
  <g transform="translate(380, 150)">
    <rect width="180" height="165" rx="12" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)"/>
    <text x="14" y="24" fill="#8c90b5" font-family="'Outfit', sans-serif" font-size="11" font-weight="600">PRODUCT SPLIT</text>

    <!-- Donut Segments -->
    <g transform="translate(90, 85)">
      <circle cx="0" cy="0" r="42" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="14"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#f2c94c" stroke-width="14" stroke-dasharray="264" stroke-dashoffset="80" transform="rotate(-90)"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#00f2fe" stroke-width="14" stroke-dasharray="264" stroke-dashoffset="180" transform="rotate(30)"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#9b51e0" stroke-width="14" stroke-dasharray="264" stroke-dashoffset="220" transform="rotate(150)"/>
      <text x="0" y="4" text-anchor="middle" fill="#f5f6fa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">100%</text>
    </g>

    <text x="35" y="150" fill="#f2c94c" font-family="'Outfit', sans-serif" font-size="10">● Enterprise</text>
    <text x="105" y="150" fill="#00f2fe" font-family="'Outfit', sans-serif" font-size="10">● Retail</text>
  </g>
</svg>